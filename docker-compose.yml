version: '3.9'

services:
  # ── FastAPI Backend ─────────────────────────────────────────
  backend:
    build: ./fraudguard-backend
    container_name: fraudguard_backend
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=${DATABASE_URL:-postgresql+asyncpg://fraudguard:secret@db:5432/fraudguard}
      - REDIS_URL=${REDIS_URL:-redis://redis:6379}
      - SECRET_KEY=${SECRET_KEY:-changeme-in-production}
    depends_on:
      - db
      - redis
    volumes:
      - ./fraudguard-backend/models:/app/models  # persist trained models
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ── Celery Worker ───────────────────────────────────────────
  celery_worker:
    build: ./fraudguard-backend
    container_name: fraudguard_celery
    command: python -m celery -A app.workers.celery_app worker --loglevel=info --concurrency=2
    environment:
      - DATABASE_URL=${DATABASE_URL:-postgresql+asyncpg://fraudguard:secret@db:5432/fraudguard}
      - REDIS_URL=${REDIS_URL:-redis://redis:6379}
    depends_on:
      - db
      - redis
    volumes:
      - ./fraudguard-backend/models:/app/models
    restart: unless-stopped

  # ── Vue Frontend (SPA) ──────────────────────────────────────
  frontend:
    build: ./fraudguard-frontend
    container_name: fraudguard_frontend
    ports:
      - "3000:80"
    restart: unless-stopped

  # ── PostgreSQL ──────────────────────────────────────────────
  db:
    image: postgres:16-alpine
    container_name: fraudguard_db
    environment:
      POSTGRES_USER: fraudguard
      POSTGRES_PASSWORD: secret
      POSTGRES_DB: fraudguard
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    restart: unless-stopped

  # ── Redis ───────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: fraudguard_redis
    ports:
      - "6379:6379"
    restart: unless-stopped

  # ── Nginx Reverse Proxy ─────────────────────────────────────
  nginx:
    image: nginx:alpine
    container_name: fraudguard_nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
    depends_on:
      - backend
      - frontend
    restart: unless-stopped

volumes:
  pgdata:
