events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # ── fraudguard.harshbhojwani.in → Vue Frontend ─────────────
    server {
        listen 80;
        server_name fraudguard.harshbhojwani.in;
        return 301 https://$host$request_uri;
    }

    server {
        listen 443 ssl;
        server_name fraudguard.harshbhojwani.in;

        ssl_certificate     /etc/letsencrypt/live/fraudguard.harshbhojwani.in/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/fraudguard.harshbhojwani.in/privkey.pem;
        ssl_protocols       TLSv1.2 TLSv1.3;

        location / {
            proxy_pass http://frontend:80;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }
    }

    # ── fraudguard-api.harshbhojwani.in → FastAPI Backend ──────
    server {
        listen 80;
        server_name fraudguard-api.harshbhojwani.in;
        return 301 https://$host$request_uri;
    }

    server {
        listen 443 ssl;
        server_name fraudguard-api.harshbhojwani.in;

        ssl_certificate     /etc/letsencrypt/live/fraudguard-api.harshbhojwani.in/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/fraudguard-api.harshbhojwani.in/privkey.pem;
        ssl_protocols       TLSv1.2 TLSv1.3;

        client_max_body_size 20M;

        location / {
            proxy_pass http://backend:8000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_read_timeout 120s;
        }

        # WebSocket support for live alerts
        location /ws/ {
            proxy_pass http://backend:8000;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_read_timeout 86400s;
        }
    }
}
